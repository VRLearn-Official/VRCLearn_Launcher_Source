name: Bug report (English)
description: Report a problem with VRCLearn Launcher. Please write in English.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English. Issues in other languages may be closed.
        Search existing issues, including closed ones, before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shown in Settings → About.
      placeholder: 1.22.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Projects
        - Repositories
        - Packages
        - Unity editor
        - Resources
        - Backup
        - Templates
        - Tools
        - Settings
        - Updates
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        On the Logs page, click Export, then drag the exported file into this field.
        Review it and remove personal paths before submitting.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files into this field, or attach them after submitting.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues, including closed ones.
          required: true
        - label: I removed personal information such as user paths from logs and screenshots.
          required: true
